<!doctype html>
<!-- Screenshot frame: the app (from the dev server, demo mode) inside a macOS window. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      .stage {
        padding: 48px 64px 72px;
        background: transparent;
      }
      .window {
        position: relative;
        width: 1440px;
        height: 900px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.12),
          0 30px 80px rgba(0, 0, 0, 0.55),
          0 8px 24px rgba(0, 0, 0, 0.35);
        background: #3a3a3e;
      }
      iframe {
        border: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .lights {
        position: absolute;
        top: 13px;
        left: 14px;
        display: flex;
        gap: 8px;
        z-index: 2;
      }
      .lights span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="window">
        <div class="lights">
          <span style="background: #ff5f57"></span><span style="background: #febc2e"></span
          ><span style="background: #28c840"></span>
        </div>
        <iframe id="app"></iframe>
      </div>
    </div>
    <script>
      document.getElementById('app').src = new URLSearchParams(location.search).get('src');
    </script>
  </body>
</html>
