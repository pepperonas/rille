[workspace]
resolver = "3"
members = ["crates/rille-core", "crates/rille-engine", "crates/rille-midi", "crates/rille-library", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Martin Pfeffer"]
repository = "https://github.com/pepperonas/rille"
rust-version = "1.98"

[workspace.dependencies]
rille-core = { path = "crates/rille-core" }
rille-engine = { path = "crates/rille-engine" }
rille-midi = { path = "crates/rille-midi" }
rille-library = { path = "crates/rille-library" }
tracing = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

# Analysis tests run real FFT work; unoptimised they take ~20 s.
[profile.dev.package.rille-library]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
